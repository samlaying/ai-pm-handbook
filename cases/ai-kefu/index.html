<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <!-- 字体：异步加载。国内网络连不上 Google Fonts 时不阻塞渲染，直接回退系统字体（见 tokens.css 的字体栈） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </noscript>

  <!-- 样式：按层拆分，tokens 是唯一定义变量的地方 -->
  <link rel="stylesheet" href="css/tokens.css?v=8">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/layout.css?v=9">
  <link rel="stylesheet" href="css/components.css?v=8">

  <link rel="stylesheet" href="css/print.css?v=8">
</head>
<body>

  <!-- 顶部阅读进度条 -->
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  <!-- 顶部导航栏 -->
  <header class="topbar">
    <button class="menu-toggle" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">
      <svg class="icon-open" width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <svg class="icon-close" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <a class="brand" id="brand" href="../../index.html" title="返回案例画廊" aria-label="AI 产品实战手册，返回案例画廊"><svg class="logo-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="1.5" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="7" height="7" fill="currentColor"/></svg><span id="brandText">AI 产品实战手册</span></a>
    <span class="case-crumb" aria-hidden="true">/ AI 客服</span>
    <span class="site-links">
      <a class="dict-link" href="../../glossary.html" title="打开名词词典">词典</a>
      <a class="dict-link" href="../../interview.html" title="打开面试题库">面试题</a>
    </span>
    <nav class="topnav" id="topNav" aria-label="模块快速导航"></nav>
  </header>

  <div class="layout">
    <!-- 侧边栏目录（内容由 render.js 依据数据生成） -->
    <aside class="sidebar" id="sidebar">
      <div class="toc" id="toc"></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <!-- Hero 区域（文案来自 data/site.js） -->
      <header class="hero" id="hero">
        <div class="hero-inner">
          <span class="kicker" id="heroKicker"></span>
          <h1 id="heroTitle"></h1>
          <p class="subtitle" id="heroSubtitle"></p>
          <p class="lede" id="heroLede"></p>
          <a class="btn" id="heroCta" href="#m01"></a>
        </div>
      </header>

      <!-- 九个模块 + 总结（由 render.js 依据数据生成） -->
      <div class="content" id="modules">
        <noscript>
          <p>本站内容由 JavaScript 渲染，请启用 JavaScript 后查看。内容源文件位于 <code>js/data/</code> 目录。</p>
        </noscript>
      </div>

    </main>
  </div>

  <!-- 页脚（文案来自 data/site.js） -->
  <footer class="footer">
    <span id="footerLeft"></span>
    <span id="footerRight"></span>
  </footer>

  <!-- 术语详解抽屉：点击正文划线词后从右侧滑入（内容由 ui/drawer.js 依据 terms.js 渲染） -->
  <aside class="term-drawer" id="termDrawer" role="dialog" aria-modal="true" aria-labelledby="termDrawerTitle">
    <header class="term-drawer-head">
      <div>
        <p class="term-drawer-kicker">术语详解</p>
        <h4 id="termDrawerTitle"></h4>
      </div>
      <button class="term-drawer-close" type="button" aria-label="关闭详解">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </header>
    <div class="term-drawer-body"></div>
  </aside>
  <div class="term-backdrop" id="termBackdrop"></div>

  <!-- 脚本：lib → data → ui → main（经典脚本，file:// 直开可用） -->
  <script src="js/lib/dom.js?v=8"></script>
  <script src="js/lib/store.js?v=8"></script>
  <script src="js/data/site.js?v=8"></script>

  <script src="js/data/module-06.js?v=8"></script>
  <script src="js/data/module-07.js?v=8"></script>
  <script src="js/data/module-08.js?v=8"></script>
  <script src="js/data/module-09.js?v=8"></script>
  <script src="js/data/summary.js?v=8"></script>
  <script src="js/ui/render.js?v=8"></script>
  <script src="js/ui/nav.js?v=8"></script>
  <script src="js/ui/progress.js?v=8"></script>

  <script src="js/ui/checklist.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
