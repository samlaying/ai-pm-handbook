<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 产品实战手册 · 名词词典：可查询的术语词典，每个词条含名词定义、项目案例与技术解析和应用。">
  <title>名词词典｜AI 产品实战手册</title>

  <!-- 字体：异步加载，连不上 Google Fonts 时回退系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </noscript>

  <link rel="stylesheet" href="css/tokens.css?v=4">
  <link rel="stylesheet" href="css/site.css?v=2">
  <link rel="stylesheet" href="css/dictionary.css?v=6">
</head>
<body>
  <a class="skip-link" href="#glossaryList">跳到词典列表</a>

  <!-- 顶栏：logo + 案例/词典 导航 -->
  <header class="topbar">
    <a class="brand" href="./" title="返回首页" aria-label="AI 产品实战手册，返回首页">
      <svg class="logo-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="1.5" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="7" height="7" fill="currentColor"/></svg>
      <span>AI 产品实战手册</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="./" data-nav="cases">案例</a>
      <a href="glossary.html" class="is-active" data-nav="glossary" aria-current="page">词典</a>
      <a href="interview.html" data-nav="interview">面试题</a>
    </nav>
    <span class="topbar-note">CASES · GLOSSARY · Q&amp;A</span>
  </header>

  <main id="main">
    <div class="glossary">
      <header class="glossary-head">
        <span class="kicker">GLOSSARY · 术语速查</span>
        <h2>名词词典</h2>
        <p class="lede">手册全线通用的术语词典：点击任意词条，查看名词定义、项目案例与技术解析和应用（按 / 可快速聚焦搜索）。</p>
      </header>

      <div class="glossary-tools">
        <input class="glossary-search" type="search" placeholder="搜索术语 / 定义…" title="快捷键：按 / 聚焦搜索" aria-label="搜索术语">
        <span class="glossary-count" id="glossaryCount" role="status"></span>
      </div>

      <!-- 左侧分组导航 + 右侧词条网格（可承载大量词条） -->
      <div class="dict-layout">
        <nav class="dict-rail" id="dictRail" aria-label="按分类筛选"></nav>
        <div id="glossaryList" aria-label="词条列表">
          <noscript>
            <p>本页内容由 JavaScript 渲染，请启用 JavaScript 后查看。数据源位于 <code>js/data/terms.js</code>。</p>
          </noscript>
        </div>
      </div>
    </div>
  </main>

  <!-- 术语详解抽屉（与案例站同款三段式） -->
  <aside class="term-drawer" id="termDrawer" role="dialog" aria-modal="true" aria-labelledby="termDrawerTitle">
    <header class="term-drawer-head">
      <div>
        <p class="term-drawer-kicker">术语详解</p>
        <h4 id="termDrawerTitle"></h4>
      </div>
      <button class="term-drawer-close" type="button" aria-label="关闭详解">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </header>
    <div class="term-drawer-body"></div>
  </aside>
  <div class="term-backdrop" id="termBackdrop"></div>

  <!-- 页脚 -->
  <footer class="footer">
    <span>© 2025 AI 产品实战手册</span>
    <span><a href="./" style="color:inherit">← 返回案例画廊</a></span>
  </footer>

  <!-- 脚本：lib → data → ui → main -->
  <script src="js/lib/dom.js?v=4"></script>
  <script src="js/data/terms.js?v=4"></script>
  <script src="js/ui/fmt.js?v=4"></script>
  <script src="js/ui/dictionary.js?v=5"></script>
  <script src="js/ui/drawer.js?v=4"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
