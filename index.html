<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 产品实战画廊：一系列可以跟着做完的 AI 项目。首个案例——零食电商 AI 客服，从一句话需求到可运行 Demo。">
  <title>AI 产品实战画廊｜一系列可以跟着做完的 AI 项目</title>

  <!-- 字体：异步加载，连不上 Google Fonts 时回退系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </noscript>

  <!-- 样式：画廊独用（案例站点在 cases/<slug>/ 下自成一体） -->
  <link rel="stylesheet" href="css/tokens.css?v=1">
  <link rel="stylesheet" href="css/gallery.css?v=1">
</head>
<body>
  <a class="skip-link" href="#caseList">跳到案例列表</a>

  <!-- 顶栏 -->
  <header class="topbar">
    <a class="brand" href="./">AI 产品实战画廊</a>
    <span class="topbar-note">CASE GALLERY · 案例系列</span>
  </header>

  <main id="main">
    <!-- Hero（统计由 ui/gallery.js 依据 cases.js 汇总） -->
    <header class="hero">
      <div class="hero-inner">
        <span class="kicker">AI 产品实战方法论 · 案例画廊</span>
        <h1>一系列可以跟着做完的 AI 项目</h1>
        <p class="subtitle">每个案例，都是一个完整走通的 AI 产品项目</p>
        <p class="lede">从一句模糊的业务指令，到可运行、可汇报的落地 Demo——同一个方法论，不同的行业与场景。选一个案例，以第一人称走进项目。</p>
        <div class="hero-stats" id="heroStats"></div>
      </div>
    </header>

    <!-- 案例列表（内容由 ui/gallery.js 依据 js/data/cases.js 渲染） -->
    <div class="section-head">
      <h2>全部案例</h2>
      <hr>
    </div>
    <section class="case-list" id="caseList" aria-label="案例列表">
      <noscript>
        <p>本页内容由 JavaScript 渲染，请启用 JavaScript 后查看。案例数据源位于 <code>js/data/cases.js</code>。</p>
      </noscript>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <span>© 2025 AI 产品实战画廊</span>
    <span>以真实项目为蓝本整理 · 仅供学习参考</span>
  </footer>

  <!-- 脚本：数据 → 渲染 → 启动 -->
  <script src="js/data/cases.js?v=1"></script>
  <script src="js/lib/dom.js"></script>
  <script src="js/ui/gallery.js?v=1"></script>
  <script src="js/main.js?v=1"></script>
</body>
</html>
